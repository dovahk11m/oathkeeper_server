services:
  loki:
    image: grafana/loki:2.9.11
    container_name: loki
    ports:
      - "3100:3100"
    command: --config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - ./loki-data/index:/loki/index
      - ./loki-data/cache:/loki/cache
      - ./loki-data/chunks:/loki/chunks
      - ./loki-data/wal:/loki/wal
      - ./loki-data/compactor:/loki/compactor
      - ./loki-data/logs:/loki/logs
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.11
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - ./loki-data/logs:/loki/logs
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: --config.file=/etc/promtail/config.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
