<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oathkeeper</title>

    <!-- Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- AdminLTE & Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body { font-family: 'Source Sans Pro', sans-serif; }
        .chat-rooms { max-height: 70vh; overflow-y: auto; }
        .direct-chat-messages { max-height: 60vh; overflow-y: auto; }
        .content-wrapper { padding-right: 200px; }
        .table td, .table th { vertical-align: middle !important; }
    </style>
</head>

<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a></li>
            <li class="nav-item d-none d-sm-inline-block"><a href="#" class="nav-link">홈</a></li>
        </ul>
    </nav>

    <!-- Sidebar -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="#" class="brand-link"><span class="brand-text font-weight-light">Oathkeeper</span></a>
        <div class="sidebar">
            <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                <div class="info"><a href="#" class="d-block">관리자</a></div>
            </div>
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column">
                    <li class="nav-item"><a href="#" class="nav-link active"><i class="nav-icon fas fa-comments"></i><p>채팅</p></a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Content -->
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid"><h1 class="m-0">활동량 대시보드</h1></div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">

                    <!-- 왼쪽: 방 목록 + 색상 범례 -->
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">시간대별 활동량 순위</h3>
                            </div>
                            <div class="card-body p-2 chat-rooms">
                                <!-- AJAX/JS에서 테이블로 채워질 영역 -->
                                <div id="activity-rank-container">
                                    <span class="text-muted">데이터를 불러오는 중...</span>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">활동량 색상 범례</h3>
                            </div>
                            <div class="card-body" style="display:flex; align-items:center; flex-wrap: wrap; justify-content: space-between;">
                                <div style="flex: 1; display:flex; align-items:center; gap:4px;">
                                    <div style="width:20px; height:20px; background-color: rgba(255,99,132,0.1);"></div>0
                                </div>
                                <div style="flex: 1; display:flex; align-items:center; gap:4px;">
                                    <div style="width:20px; height:20px; background-color: rgba(255,99,132,0.25);"></div>25
                                </div>
                                <div style="flex: 1; display:flex; align-items:center; gap:4px;">
                                    <div style="width:20px; height:20px; background-color: rgba(255,99,132,0.5);"></div>50
                                </div>
                                <div style="flex: 1; display:flex; align-items:center; gap:4px;">
                                    <div style="width:20px; height:20px; background-color: rgba(255,99,132,0.75);"></div>75
                                </div>
                                <div style="flex: 1; display:flex; align-items:center; gap:4px;">
                                    <div style="width:20px; height:20px; background-color: rgba(255,99,132,1);"></div>100
                                </div>
                            </div>
                        </div>



                    </div>

                    <!-- 오른쪽: 날짜 선택 + 차트 + 표 -->
                    <div class="col-md-9">
                        <!-- 날짜 선택 -->
                        <div class="card mb-3">
                            <div class="card-header"><h3 class="card-title">기간별 활동량 조회</h3></div>
                            <div class="card-body">
                                <div class="form-row mb-3">
                                    <div class="col">
                                        <label for="startDate">시작 날짜</label>
                                        <input type="date" id="startDate" class="form-control">
                                    </div>
                                    <div class="col">
                                        <label for="endDate">종료 날짜</label>
                                        <input type="date" id="endDate" class="form-control">
                                    </div>
                                    <div class="col-auto align-self-end">
                                        <button id="searchBtn" class="btn btn-primary">검색</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 히트맵 차트 -->
                        <div class="card card-outline card-primary">
                            <div class="card-header"><h3 class="card-title">회원 활동 히트맵</h3></div>
                            <div class="card-body table-responsive p-0" style="height: 400px;">
                                <canvas id="heatmap" style="width:100%; height:100%;"></canvas>
                            </div>
                        </div>

                        <!-- 활동량 표 -->
                        <div class="card card-outline card-info mt-3">
                            <div class="card-header"><h3 class="card-title">요일 × 시간대 활동량 표</h3></div>
                            <div class="card-body" id="heatmap-table-container" style="overflow-x:auto;"></div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment/min/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.2.0/dist/chartjs-chart-matrix.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<script>
    $(function() {
        const startOfMonth = moment().startOf('month').format('YYYY-MM-DD');
        const endOfMonth = moment().endOf('month').format('YYYY-MM-DD');
        $('#startDate').val(startOfMonth);
        $('#endDate').val(endOfMonth);

        function loadData(start, end) {
            $('#heatmap-table-container').html('<span class="text-muted">데이터를 불러오는 중...</span>');
            $('#activity-rank-container').html('<span class="text-muted">데이터를 불러오는 중...</span>');

            $.ajax({
                url: '/api/admin/active-chart',
                method: 'GET',
                data: { start, end },
                success: function(dataMatrix) {
                    if (!dataMatrix || dataMatrix.length === 0) {
                        $('#heatmap-table-container').html('<span class="text-muted">데이터가 없습니다</span>');
                        $('#activity-rank-container').html('<span class="text-muted">데이터가 없습니다</span>');
                        return;
                    }

                    const days = ['월','화','수','목','금','토','일'];
                    const hours = Array.from({ length: 24 }, (_, i) => i);

                    // ------------------ 히트맵 ------------------
                    const ctx = document.getElementById('heatmap').getContext('2d');
                    if (window.heatmapChart) window.heatmapChart.destroy();
                    window.heatmapChart = new Chart(ctx, {
                        type: 'matrix',
                        data: {
                            datasets: [{
                                label: '요일 × 시간대 활동량',
                                data: dataMatrix,
                                backgroundColor: ctx => {
                                    const v = ctx.dataset.data[ctx.dataIndex].v;
                                    return `rgba(255,99,132,${Math.min(v/100,1)})`;
                                },
                                width: ({ chart }) => (chart.chartArea || {}).width / hours.length - 2,
                                height: ({ chart }) => (chart.chartArea || {}).height / days.length - 2
                            }]
                        },
                        options: {
                            maintainAspectRatio: false,
                            scales: {
                                x: { type: 'linear', ticks: { stepSize: 1, callback: val => hours[val] + '시' } },
                                y: { type: 'linear', ticks: { stepSize: 1, callback: val => days[val] } }
                            },
                            plugins: {
                                tooltip: {
                                    callbacks: {
                                        label: ctx => `${days[ctx.raw.y]} ${hours[ctx.raw.x]}시: ${ctx.raw.v}`
                                    }
                                }
                            }
                        }
                    });

                    // ------------------ 히트맵 표 ------------------
                    const tableData = Array.from({ length: 7 }, () => Array(24).fill(0));
                    let maxVal = 0;
                    dataMatrix.forEach(d => {
                        if(d.y<7 && d.x<24){
                            tableData[d.y][d.x] = d.v;
                            maxVal = Math.max(maxVal,d.v);
                        }
                    });
                    const dayTotals = tableData.map(r=>r.reduce((a,b)=>a+b,0));
                    const hourAverages = Array.from({length:24},(_,h)=>(tableData.map(r=>r[h]).reduce((a,b)=>a+b,0)/7).toFixed(1));

                    let tableHTML = `<table class="table table-bordered text-center">
                        <thead><tr><th>요일</th>${hours.map(h=>`<th>${h}시</th>`).join('')}<th>합계</th></tr></thead>
                        <tbody>
                        ${tableData.map((row,i)=>`<tr><td><strong>${days[i]}</strong></td>${row.map(v=>{
                            const alpha = Math.min(v/maxVal,1);
                            const color = alpha>0.5?'white':'black';
                            const border = v===maxVal?'3px solid #000':'1px solid #dee2e6';
                            const weight = v===maxVal?'bold':'normal';
                            return `<td style="background:rgba(255,99,132,${alpha});color:${color};border:${border};font-weight:${weight}">${v}</td>`;
                        }).join('')}<td><strong>${dayTotals[i]}</strong></td></tr>`).join('')}
                        </tbody>
                        <tfoot>
                            <tr class="bg-light font-weight-bold"><td>평균</td>${hourAverages.map(avg=>{
                                const alpha = Math.min(avg/maxVal,1);
                                const color = alpha>0.5?'white':'black';
                                return `<td style="background:rgba(255,99,132,${alpha});color:${color}">${avg}</td>`;
                            }).join('')}<td>-</td></tr>
                        </tfoot>
                    </table>`;
                    $('#heatmap-table-container').html(tableHTML);

                    // ------------------ 시간대별 활동량 순위 ------------------
// 시간대별 활동량 + 최고 요일 계산
const hourTotals = Array.from({length:24},()=>0);
const hourMaxDay = Array.from({length:24},()=>null); // 각 시간대 최고 요일

dataMatrix.forEach(d => {
    if(d.x<24 && d.y<7){
        hourTotals[d.x] += d.v;
        // 최대값 계산
        if(hourMaxDay[d.x]===null || d.v > hourMaxDay[d.x].v){
            hourMaxDay[d.x] = { day: days[d.y], v: d.v };
        }
    }
});

// 시간대 + 활동량 + 요일 배열 만들기
const rankData = hourTotals.map((activity, hour) => ({
    hour,
    activity,
    maxDay: hourMaxDay[hour] ? hourMaxDay[hour].day : '-'
}));

// 내림차순 정렬
rankData.sort((a,b)=>b.activity - a.activity);

// 상위 10개 테이블 생성
const rankTableHTML = `
    <table class="table table-sm table-bordered text-center mb-0">
        <thead>
            <tr>
                <th>순위</th>
                <th>최다 요일</th>
                <th>시간대</th>
                <th>활동량</th>

            </tr>
        </thead>
        <tbody>
            ${rankData.slice(0,10).map((item, idx)=>`
                <tr>
                    <td>${idx+1}</td>
                    <td>${item.maxDay}</td>
                    <td>${item.hour}시</td>
                    <td>${item.activity}</td>

                </tr>
            `).join('')}
        </tbody>
    </table>
`;
$('#activity-rank-container').html(rankTableHTML);


                },
                error:function(){
                    $('#heatmap-table-container').html('<span class="text-danger">데이터 불러오기 실패</span>');
                    $('#activity-rank-container').html('<span class="text-danger">데이터 불러오기 실패</span>');
                }
            });
        }

        $('#searchBtn').click(function() {
            const start = $('#startDate').val();
            const end = $('#endDate').val();
            if(!start||!end){ alert('시작/종료 날짜를 모두 선택하세요'); return; }
            if(moment(end).isBefore(start)){ alert('종료일은 시작일 이후여야 합니다'); return; }
            if(moment(end).diff(moment(start),'days')>30){ alert('기간은 한 달 이내로 제한됩니다'); return; }
            window.history.pushState({}, '', `${window.location.pathname}?start=${start}&end=${end}`);
            loadData(start,end);
        });

        loadData(startOfMonth,endOfMonth);
    });
</script>

</body>
</html>
