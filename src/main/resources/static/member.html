<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 목록 (관리자)</title>
    <style>
        .pagination {
          margin-top: 10px;
        }
        .pagination button {
          margin: 0 3px;
          padding: 4px 8px;
        }
    </style>
</head>
<body>
<h2>회원 목록</h2>
<table id="memberTable" border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>이름</th>
        <th>이메일</th>
        <th>권한</th>
        <th>소셜 타입</th>
        <th>상태</th>
        <th>소셜 아이디</th>
        <th>마지막 로그인 날짜</th>
        <th>금지 만료 기간</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<div class="pagination"></div>

<script>
    let currentPage = 0;
    const size = 5; // 한 페이지당 5명씩

    function loadMembers(page = 0) {
      fetch(`/api/admin/members?page=${page}&size=${size}`)
        .then(res => res.json())
        .then(data => {
          const tbody = document.querySelector('#memberTable tbody');
          tbody.innerHTML = ''; // 기존 내용 비우기

          data.content.forEach(member => {
            const row = `
              <tr>
                <td>${member.id}</td>
                <td>${member.name}</td>
                <td>${member.email}</td>
                <td>${member.role}</td>
                <td>${member.socialType}</td>
                <td>${member.status}</td>
                <td>${member.socialId}</td>
                <td>${member.lastLogin}</td>
                <td>${member.bannedUntil}</td>
              </tr>
            `;
            tbody.insertAdjacentHTML('beforeend', row);
          });

          // 페이지 버튼 다시 그리기
          renderPagination(data);
        });
    }

    function renderPagination(pageData) {
      const pagination = document.querySelector('.pagination');
      pagination.innerHTML = '';

      for (let i = 0; i < pageData.totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i + 1;
        if (i === pageData.number) {
          btn.disabled = true;
        }
        btn.addEventListener('click', () => loadMembers(i));
        pagination.appendChild(btn);
      }
    }

    loadMembers(currentPage);
</script>
</body>
</html>
