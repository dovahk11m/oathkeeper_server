<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>장소 검색 및 저장</title>
    <style>
        #map { width: 100%; height: 400px; }
        #controls { margin: 10px 0; }
    </style>
    <!-- Prism Core -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.js"></script>

    <!-- 언어 모듈 -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-markup.min.js"></script>

</head>
<body>

<!-- 카카오 지도 SDK 로딩 -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8168fe817ae0d61fedd845fb08b5c805&libraries=services&autoload=false"></script>


<div id="controls">
    <input type="text" id="keyword" placeholder="장소를 입력하세요">
    <button id="searchBtn">검색</button>
</div>
<div id="map"></div>



<script>
    let map = null;
    let ps = null;

    window.onload = function() {

    kakao.maps.load(function(){

    const mapContainer = document.getElementById('map');
    const mapOption = {
        center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울 중심 좌표
        level: 3
    };


    map = new kakao.maps.Map(mapContainer, mapOption);

    // ✅ 장소 검색 객체 생성
    ps = new kakao.maps.services.Places();

    searchBtn.addEventListener('click', searchPlaces);

});
};

    // ✅ 검색 함수
    function searchPlaces() {
        const keyword = document.getElementById('keyword').value.trim();
        if (!keyword) {
            alert('검색어를 입력하세요.');
            return;
        }
        ps.keywordSearch(keyword, placesSearchCB);
    }

    // ✅ 검색 완료 시 호출되는 콜백
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            const bounds = new kakao.maps.LatLngBounds();
            for (let i = 0; i < data.length; i++) {
                displayMarker(data[i]);
                bounds.extend(new kakao.maps.LatLng(data[i].y, data[i].x));
            }
            map.setBounds(bounds);
        } else {
            alert('검색 결과가 없습니다.');
        }
    }

    // ✅ 마커 표시
function displayMarker(place) {
    const marker = new kakao.maps.Marker({
        map: map,
        position: new kakao.maps.LatLng(place.y, place.x)
    });

    const infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

    kakao.maps.event.addListener(marker, 'click', function() {
        // 말풍선 안에 저장 버튼 추가
        const content = `
            <div style="padding:5px;font-size:12px;">
                ${place.place_name} <br>
                <button onclick="savePlace('${place.place_name}','${place.address_name}', '${place.y}', '${place.x}')">저장</button>
            </div>
        `;
        infowindow.setContent(content);
        infowindow.open(map, marker);
    });
}

// ✅ 장소 저장 함수
function savePlace(name, address, lat, lng) {

    // 2) 필요하면 서버로 저장도 가능

    fetch('api/admin/places/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, address, lat, lng })
    })
    .then(res => res.json())
    .then(data => console.log(data));
    alert(name + ' 장소가 저장되었습니다!');

}
</script>



</body>
</html>
