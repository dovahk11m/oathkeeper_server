spring:
  # ===================================================================
  # 1. 데이터소스(DB) 설정
  # ===================================================================
  datasource:
    # 1-1. H2 설정 url: jdbc:h2:mem:solidtask -> 'solidtask'라는 이름의 메모리 기반 DB를 사용합니다.
    h2-db:
      jdbc-url: jdbc:h2:mem:oath
      username: sa # H2 DB 기본 사용자 이름
      password: # 비밀번호는 없음
      driver-class-name: org.h2.Driver # H2 드라이버 지정

    # 1-2. MySQL 설정
    mysql:
      jdbc-url: jdbc:mysql://localhost:3306/oath?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true
      username: root
      password: asd1234
      driver-class-name: com.mysql.cj.jdbc.Driver

    # 1-3. PostgreSQL 설정
    pg:
      jdbc-url: jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
      username: postgres.ucvalhtcwaxscdmyjoiz
      password: postgreSql123
      driver-class-name: org.postgresql.Driver

      hikari:
        maximum-pool-size: 3
        minimum-idle: 1

  # ===================================================================
  # 2. H2 데이터베이스 콘솔 설정
  # ===================================================================
  h2:
    console:
      enabled: true # H2 콘솔 기능 활성화
      path: /h2-console # <http://localhost:8080/h2-console>

  # ===================================================================
  # 3. JPA 및 Hibernate 설정
  # ===================================================================
  jpa:
    # 3-1. 공통 JPA 설정
    open-in-view: false # OSIV 비활성화 (권장)

    # 3-2. H2 전용 JPA 속성 (H2JpaConfig에서 사용)
    h2-props:
      properties:
        hibernate:
          ddl-auto: create-drop
          format_sql: true
          dialect: org.hibernate.dialect.H2Dialect
      show-sql: true

    # 3-3. MySQL 전용 JPA 속성 (MySqlJpaConfig에서 사용)
    mysql-props:
      hibernate:
      properties:
        hibernate:
          # (중요) 운영 환경에서는 'validate' 또는 'none' 사용
          ddl-auto: create-drop
          default_batch_fetch_size: 100
          format_sql: true # SQL 포맷팅
          dialect: org.hibernate.dialect.MySQLDialect
      show-sql: true # SQL 로그 출력 (개발용)

    # 3-4. PostgreSQL 전용 JPA 속성 (PgJpaConfig에서 사용)
    pg-props:
      properties:
        hibernate:
          ddl-auto: update
          default_batch_fetch_size: 100
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
          default_schema: oath
      show-sql: true
  
  # 메일 발송(SMTP) 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: choongechobiz@gmail.com # 보내는 메일 계정
    password: merg zhtu edxo zszf # 해당 계정의 16자리 앱 비밀번호
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

